services:
  db:
    image: postgres:16
    container_name: eve-healthcare-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
      POSTGRES_DB: eve_healthcare

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: eve-healthcare-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://eve_user:eve_password@db:5432/eve_healthcare
      JWT_SECRET_KEY: eve-healthcare-development-secret-change-this
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: