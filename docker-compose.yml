services:
  db:
    image: postgres:16
    container_name: eve-healthcare-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
      POSTGRES_DB: eve_healthcare

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: